# DigitalOcean App Platform spec.
# Deploy/update with: doctl apps create --spec .do/app.yaml
#                  or: doctl apps update <app-id> --spec .do/app.yaml
#
# The "db" component below is an App Platform **Dev Database** — a Postgres
# instance provisioned inside this same app, alongside the api service.
# Its connection string is injected into the api service automatically via
# the ${db.DATABASE_URL} bindable variable. This satisfies "hostable in the
# same session/app" without standing up a separate Managed Database cluster.
name: acrova-backend
region: nyc

services:
  - name: api
    # Build with the Python buildpack (no Dockerfile in the repo root, so
    # buildpack detection wins). The buildpack sees pyproject.toml + uv.lock
    # + .python-version and runs `uv sync --locked` into a virtualenv that is
    # activated for the run command below.
    environment_slug: python
    source_dir: /
    github:
      repo: KarlOlofA/acrova_backend
      branch: main
      deploy_on_push: true
    # The buildpack's uv is build-time only, so uv is pinned as a project
    # dependency and comes from the synced virtualenv here. --active reuses
    # that virtualenv (App Platform exports VIRTUAL_ENV, not
    # UV_PROJECT_ENVIRONMENT, at run time) and --no-sync keeps boot from
    # re-resolving dependencies. Mirrors the Procfile.
    run_command: uv run --active --no-sync alembic upgrade head && uv run --active --no-sync main.py
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      # Flip this to "development" here (or in the console) to get reload +
      # debug logging without touching the code.
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      # main.py binds to HOST:PORT. The buildpack image sets no defaults (the
      # old Dockerfile did), and App Platform routes to http_port above.
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      # The public address of the service. ${APP_URL} resolves to this app's
      # URL; replace it with http://<droplet-ip>:<port> on a plain Droplet.
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # Comma-separated browser origins, or "*" for any.
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "*"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: LINKEDIN_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: LINKEDIN_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Optional: leave unset and it is derived from PUBLIC_BASE_URL as
      # <base-url>/api/auth/linkedin/callback. Set it only if LinkedIn is
      # registered with a different URI.
      - key: LINKEDIN_REDIRECT_URI
        scope: RUN_TIME
      - key: SUPABASE_URL
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_CV_BUCKET
        scope: RUN_TIME
        value: cvs

databases:
  - name: db
    engine: PG
    production: false
