# DigitalOcean App Platform spec.
# Deploy/update with: doctl apps create --spec .do/app.yaml
#                  or: doctl apps update <app-id> --spec .do/app.yaml
#
# The api service talks to an external Postgres (this project's Supabase
# instance) through the DATABASE_URL secret below.
#
# There is deliberately no `databases:` block. An App Platform dev database is
# provisioned *inside* the app, which has two problems: the component cannot be
# renamed (a rename is read as destroy+create and parks the deploy on a
# "creating <name>" step), and its storage does not outlive the app. Supabase
# already hosts the CV bucket, so its Postgres is reused here.
name: acrova-backend
region: nyc

services:
  - name: api
    # Build with the Python buildpack (no Dockerfile in the repo root, so
    # buildpack detection wins). The buildpack sees pyproject.toml + uv.lock
    # + .python-version and runs `uv sync --locked` into a virtualenv that is
    # activated for the run command below.
    environment_slug: python
    source_dir: /
    github:
      repo: KarlOlofA/acrova_backend
      branch: main
      deploy_on_push: true
    # The buildpack's own uv is build-time only, so uv is pinned as a project
    # dependency and the copy used here comes from the installed environment.
    #
    # That environment is the Python install prefix itself (.heroku/python),
    # not a virtualenv, and the buildpack only exports UV_PROJECT_ENVIRONMENT
    # during the build. Without it at run time, uv ignores the installed
    # packages, creates an empty ./.venv and the app dies with
    # ModuleNotFoundError - so derive the prefix from the python on PATH.
    # --no-sync then reuses it as-is instead of re-resolving on boot.
    # Mirrors the Procfile.
    run_command: export UV_PROJECT_ENVIRONMENT=$(dirname $(dirname $(command -v python3))) && uv run --no-sync alembic upgrade head && exec uv run --no-sync main.py
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      # Flip this to "development" here (or in the console) to get reload +
      # debug logging without touching the code.
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      # main.py binds to HOST:PORT. The buildpack image sets no defaults (the
      # old Dockerfile did), and App Platform routes to http_port above.
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      # The public address of the service. ${APP_URL} resolves to this app's
      # URL; replace it with http://<droplet-ip>:<port> on a plain Droplet.
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # Comma-separated browser origins, or "*" for any.
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "*"
      # Full Postgres connection string. Kept as a SECRET with no value in
      # the spec - set it in the console (or fill it in before `doctl apps
      # update`) so the password is never committed.
      #
      # Use Supabase's **shared pooler** host, not the direct
      # db.<ref>.supabase.co one: direct connections are IPv6-only unless the
      # IPv4 add-on is purchased, while the shared pooler is IPv4 on every
      # plan. Port 5432 on the pooler host is session mode, which is the safe
      # default here - port 6543 is transaction mode and breaks prepared
      # statements (see app/db/session.py).
      #   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # RUN_TIME only: nothing in the build touches the database, since
      # migrations run from run_command.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: LINKEDIN_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: LINKEDIN_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Optional: leave unset and it is derived from PUBLIC_BASE_URL as
      # <base-url>/api/auth/linkedin/callback. Set it only if LinkedIn is
      # registered with a different URI.
      - key: LINKEDIN_REDIRECT_URI
        scope: RUN_TIME
      - key: SUPABASE_URL
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_CV_BUCKET
        scope: RUN_TIME
        value: cvs
